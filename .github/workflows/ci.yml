name: CI

on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install FFmpeg
        run: brew install ffmpeg
      - run: pnpm install --frozen-lockfile
      # tauri-build needs the sidecar files to exist; the tests use the brew FFmpeg.
      - run: pnpm fetch:ffmpeg
      - run: pnpm exec tsc --noEmit
      - run: pnpm test
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      # Hosted runners get no multicast, so the mDNS discovery test cannot see its own announcement.
      - run: cargo test --manifest-path src-tauri/Cargo.toml -- --skip discovers_a_cast_device_announced_on_mdns
