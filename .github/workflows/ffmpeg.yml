# Builds the bundled ffmpeg and ffprobe for every target with
# scripts/build-ffmpeg.sh and publishes them, with SHA256SUMS and the exact
# source tarballs, as the release ffmpeg-<version>. Run it by hand once per
# FFmpeg version. Afterwards, `node scripts/fetch-ffmpeg.mjs <triple>` checks
# each download against SHA256SUMS and prints its sha256: pin those values in
# scripts/ffmpeg.json.
name: FFmpeg

on:
  workflow_dispatch:
    inputs:
      version:
        description: FFmpeg release, with its sha256 pinned in scripts/build-ffmpeg.sh
        required: true
        default: "9.1"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-latest
          - target: x86_64-apple-darwin
            runner: macos-26-intel
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install build tools (macOS)
        if: runner.os == 'macOS'
        run: brew install nasm meson ninja pkgconf
      - name: Install build tools (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y nasm meson ninja-build pkg-config
      - name: Install mingw-w64
        if: contains(matrix.target, 'windows')
        run: sudo apt-get install -y mingw-w64
      - name: Build
        env:
          OUT_DIR: out
          VERSION: ${{ inputs.version }}
        run: bash scripts/build-ffmpeg.sh "${{ matrix.target }}" "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ffmpeg-${{ matrix.target }}
          path: out/
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      # Every job saved the same source tarballs; merging keeps one copy.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: out
          merge-multiple: true
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ffmpeg-${{ inputs.version }}
          VERSION: ${{ inputs.version }}
        run: |
          cd out
          sha256sum -- * > SHA256SUMS
          # Never "latest": the app's updater reads releases/latest.
          gh release view "$TAG" >/dev/null 2>&1 ||
            gh release create "$TAG" --latest=false --target "$GITHUB_SHA" --title "FFmpeg $VERSION" \
              --notes "ffmpeg and ffprobe built by scripts/build-ffmpeg.sh, with the source tarballs they were built from."
          gh release upload "$TAG" --clobber -- *
